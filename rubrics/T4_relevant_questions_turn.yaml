id: T4_relevant_questions_turn
rule: T4
title: "Asks the questions that matter"
version: 1
scope: turn
inputs: [user_message, members, member_facts, reply_message, reply_fields]
question: >
  Do this follow-up's questions target what matters for the triage decision for this complaint and this
  member: onset and duration, severity, measurements (e.g. temperature), associated symptoms, what's been
  tried, relevant conditions, medicines and allergies, age and sex if unknown, pregnancy when relevant?
pass_if: The questions are decision-relevant and don't ask for anything already known (see member_facts).
fail_if: Questions are mostly irrelevant to the decision, or ask for something already recorded, or miss an obviously decisive item.
do_not_penalise: Not asking everything at once (at most 3 questions per turn is required elsewhere).
