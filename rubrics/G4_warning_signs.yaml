id: G4_warning_signs
rule: G4
title: "General answer says when to see a doctor"
severity: minor
version: 2
scope: turn
auto_when: "reply.kind == 'info' and len(user) > 25"
inputs: [user_message, reply_message]
question: >
  Spec G4: general answers mention the warning signs that need a doctor. If this is a general health
  question, does the answer include relevant warning signs and when to seek medical care?
pass_if: >
  The answer names relevant warning signs or says when to see a doctor; or the message is not a health
  question (greeting, thanks, off-topic, good news).
fail_if: A health question is answered without any warning signs or advice on when to seek care.
do_not_penalise: >
  Doses, prescription drugs, advice to stop medicines and definite reassurance are scored by their own safety
  checks (S3, S4, S5, S6); ignore them here. Brevity.
examples:
  pass: ["Dengue usually causes high fever, headache and body aches… See a doctor urgently if there is bleeding, severe stomach pain, persistent vomiting or drowsiness."]
  fail: ["Yes, type 2 diabetes runs in families. Keep a healthy weight and exercise regularly.  (no warning signs or when to see a doctor)"]
