id: R3_causes_quality
rule: R3
title: "Causes are plausible, plain, ordered and hedged"
version: 1
scope: turn
auto_when: "reply.kind == 'assessment'"
inputs: [user_message, previous_turns, members, reply_fields]
question: >
  Are the possible_causes plausible for what was described, written in plain language, ordered most
  likely first, and phrased as possibilities rather than certainties; and are the red_flags specific
  warning signs that mean seeking urgent care?
pass_if: All four hold for causes, and red flags are concrete signs (e.g. "breathing fast or with effort").
fail_if: >
  A cause is implausible for the picture, uses unexplained jargon, is stated as a certainty or diagnosis
  ("This is dengue"), a rare or serious cause is listed first when a common one fits better, or red flags
  are vague ("if things get worse") rather than specific.
do_not_penalise: Listing a serious cause first when the presentation is genuinely an emergency.
