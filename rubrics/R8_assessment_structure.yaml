id: R8_assessment_structure
rule: R8
title: "Assessment explains itself and ends with a not-a-diagnosis line"
version: 1
scope: turn
auto_when: "reply.kind == 'assessment'"
inputs: [reply_fields, reply_message]
question: >
  Does the assessment message explain, in plain language, (1) what it might be, (2) what to do now —
  home care for self_care, or when and whom to see otherwise — and (3) when to seek urgent help, and
  (4) end with a brief reminder that this is not a diagnosis?
pass_if: All four parts are present; the not-a-diagnosis reminder is at or very near the end.
fail_if: Any part is missing, or the not-a-diagnosis reminder is absent or appears only at the start.
do_not_penalise: Order of parts 1-3, headings, bullet lists. For urgent cases, part 3 may be the main instruction itself.
