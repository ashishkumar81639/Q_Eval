id: t_cold_breathing_difficulty
title: Cold symptoms plus breathlessness at rest is not under-triaged (twin)
rules: [T8, T7, S2]
twin: t_mild_cold_self_care
seed:
  holder: {name: Arjun, sex: male, date_of_birth: "1994-12-12"}
turns:
