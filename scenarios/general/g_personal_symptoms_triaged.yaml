id: g_personal_symptoms_triaged
title: '"I''ve had chest pain since morning" is triaged, not answered as a general question'
rules: [G3, W2]
seed:
  holder: {name: Rahul, sex: male, date_of_birth: "1975-01-01"}
turns:
  - at: "0d 14:00"
    user: "I've had chest pain since morning"
    # Decision (docs/eval-quality-fix-plan.md, issue 6): the spec lists chest pain as an emergency (S1/S2)
    # but uses this exact message in G3 as something that is triaged. Scored under G3 only: it must be
    # triaged (not answered as general info); a focused follow-up is allowed.
    emergency: false
    expect:
      - "reply.kind != 'info'                    # G3: triaged, not answered as a general question"
      - "reply.subject_ids == [ref('self')]      # W2"
