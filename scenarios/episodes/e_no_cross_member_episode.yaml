id: e_no_cross_member_episode
title: A sibling's fever gets its own episode, not the sister's
rules: [E5, E1, W10]
seed:
  holder: {name: Gaurav, sex: male, date_of_birth: "1988-05-01"}
  subjects:
    - {ref: aarav, relation: son, name: Aarav, sex: male, date_of_birth: "{{date:-8y}}"}
    - {ref: riya, relation: daughter, name: Riya, sex: female, date_of_birth: "{{date:-4y}}"}
  episodes:
    - {ref: fever, subject_ref: riya, complaint: fever, opened_at: "{{t:-1d 18:00}}", last_activity_at: "{{t:-1d 18:30}}", status: open}
turns:
  - at: "0d 10:00"
    user: "now Aarav also has a fever since this morning"
    expect:
      - "reply.subject_ids[0] == ref('aarav')                      # W2"
      - "reply.episode_id != ref('fever')                          # E5: not the sister's fever episode"
      - "state.episodes(subject=ref('aarav')).count >= 1           # E1: the son gets his own episode"
      - "state.facts(subject=ref('riya'), this_turn=true).count == 0   # W10: nothing saved on the sister"
