id: tm_paracetamol_hour_ago
title: '"gave paracetamol an hour ago" is stored as a clock time with a date'
rules: [TM1, S3]
seed:
  holder: {name: Neha, sex: female, date_of_birth: "1992-02-11"}
  subjects:
    - {ref: riya, relation: daughter, name: Riya, sex: female, date_of_birth: "{{date:-5y}}"}
turns:
  - at: "0d 21:00"
    user: "I gave Riya paracetamol an hour ago for her fever and it's still 101F"
    expect:
      - "state.facts(subject=ref('riya')).any((value ~ 'paracetamol' or key ~ 'paracetamol') and value ~ date_re(0))             # TM1: paracetamol time saved with today's date"
      - "state.facts(subject=ref('riya')).any((value ~ 'paracetamol' or key ~ 'paracetamol') and value ~ '\\\\b(8(:00)?\\\\s*(pm|p\\\\.m\\\\.)|20:00)')   # TM1: paracetamol time saved as about 8 PM"
      - "state.facts(subject=ref('riya')).none(value ~ 'hour ago')                                      # TM1: no 'an hour ago' in saved facts"
