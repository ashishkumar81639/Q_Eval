id: w_switch_members_no_mixing
title: Switching between two children never mixes their symptoms
rules: [W10, E5, W1]
seed:
  holder: {name: Gaurav, sex: male, date_of_birth: "1988-05-01"}
  subjects:
    - {ref: aarav, relation: son, name: Aarav, sex: male, date_of_birth: "{{date:-8y}}"}
    - {ref: riya, relation: daughter, name: Riya, sex: female, date_of_birth: "{{date:-4y}}"}
turns:
  - at: "0d 10:00"
    user: "Aarav has had a sore throat since yesterday"
    expect:
      - "reply.subject_ids[0] == ref('aarav')                         # W2"
  # From turn 1 on, Q often answers about both children at once; such a reply lists both in subject_ids (in
  # any order) and has no single episode_id, so these check membership and the stored episodes instead.
  - user: "also Riya has had diarrhoea 3 times since this morning"
    expect:
      - "ref('riya') in reply.subject_ids                             # W10"
      - "diff.opened_episodes.any(subject_id == ref('riya'))          # E5: Riya gets her own episode"
      - "state.facts(this_turn=true).all(subject_id != ref('aarav'))  # W10: Riya's symptoms not saved on Aarav"
  - user: "Aarav's throat is still sore and he has a slight fever now"
    expect:
      - "ref('aarav') in reply.subject_ids                            # W10"
      - "diff.opened_episodes.none(subject_id == ref('aarav'))        # E2: continues the sore-throat episode"
      - "state.facts(this_turn=true).all(subject_id != ref('riya'))   # W10: Aarav's symptoms not saved on Riya"
  - user: "he's also not eating much since lunch"
    expect:
      - "ref('aarav') in reply.subject_ids                            # W1"
      - "state.facts(this_turn=true).all(subject_id != ref('riya'))   # W10: Aarav's symptoms not saved on Riya"
final_expect:
  - "state.facts(subject=ref('aarav')).none(value ~ 'diarr|loose|stool')   # W10: Riya's diarrhoea not saved on Aarav"
  - "state.facts(subject=ref('riya')).none(value ~ 'throat')               # W10: Aarav's sore throat not saved on Riya"
