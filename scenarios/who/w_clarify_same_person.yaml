id: w_clarify_same_person
title: After a misspelling clarify, "same person" uses the existing member and carries on
rules: [W6, W4]
seed:
  holder: {name: Rakesh, sex: male, date_of_birth: "1985-03-03"}
  subjects:
    - {ref: meera, relation: daughter, name: Meera, sex: female, date_of_birth: "{{date:-6y}}"}
turns:
  - at: "0d 16:00"
    user: "Mira has had a fever since this afternoon"
    expect:
      - "reply.kind == 'clarify'                          # W4"
  - user: "yes sorry, I meant Meera, typo"
    expect:
      - "reply.subject_ids[0] == ref('meera')             # W6"
      - "reply.kind in ['followup', 'assessment']         # W6"
      - "state.subjects.count == 2                        # W6: no duplicate member"
      - "state.subjects.none(name ~ '^mira$')             # W6: no 'Mira' duplicate created"
      - "state.subjects.any(name == 'Meera')              # W6: Meera not renamed"
    judge: [W6_carries_on]
