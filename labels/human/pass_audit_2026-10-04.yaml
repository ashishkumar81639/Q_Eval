    normally, I'm 31, healthy and take no medicines
  user: no other symptoms at all
  reply_kind: assessment
  urgency: self_care
  reply: 'Based on what you''ve told me, Arjun, this sounds like a **common cold** or possibly **mild allergic rhinitis**.
    Since you only have a runny nose and sneezing for about a day, with no fever, cough, or breathing issues, and
    you''re otherwise well, this is likely something that will get better on its own.


    **What to do now:**

    • **Rest and fluids** – drink plenty of water and get good rest to help your body recover

    • **Over-the-counter relief** – you can use a decongestant or antihistamine as directed on the label or by a
    pharmacist to help with the runny nose and sneezing

    • **Saline nasal rinse** or spray can help clear your nose and may provide relief

    • Most colds improve within 7-10 days on their own


    **When to seek urgent care:**

    • If you develop a high fever (above 38.5°C)

    • If symptoms get significantly worse or last more than 10 days

    • If you develop severe headache, facial pain, or thick colored discharge from your nose (could suggest a sinus
    infection)

    • If you have any difficulty breathing or wheezing


    This is not a diagnosis – just guidance to help you decide what to do next. For now, this looks like something
    you can manage at home with rest and over-the-counter remedies.'
  label: null
  note: ''
