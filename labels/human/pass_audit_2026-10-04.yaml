  user: my dad has type 2 diabetes, does it run in families?
  reply_kind: info
  urgency: null
  reply: 'Yes, type 2 diabetes does tend to run in families. If your father has it, your risk is higher than someone
    with no family history — but it''s not inevitable. Genes play a role, but lifestyle factors like diet, exercise
    and weight are just as important.


    **What you can do:**

    • Maintain a healthy weight

    • Stay physically active (at least 30 minutes most days)

    • Eat a balanced diet with whole grains, vegetables, lean protein and limited sugar/refined carbs

    • Get screened regularly (fasting blood sugar or HbA1c test every 1–3 years, or as your doctor advises)


    **Warning signs to watch for:**

    • Increased thirst and frequent urination

    • Unexplained weight loss

    • Extreme tiredness

    • Blurred vision

    • Slow-healing cuts or infections


    Catching it early makes a big difference. If you''d like, I can help you keep track of any symptoms or health
    checks.'
  label: null
